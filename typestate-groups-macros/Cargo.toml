[package]
name = "typestate-groups-macros"
version = "0.1.5"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Procedural macros powering the typestate-groups crate"
keywords = ["typestate", "proc-macro", "grouping"]
categories = ["rust-patterns", "development-tools::procedural-macro-helpers"]
readme = "../README.md"

[lib]
proc-macro = true

[dependencies]
extend = "1.2.0"
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.5", features = ["full", "extra-traits", "visit", "visit-mut"] }

[dev-dependencies]
trybuild = "1.0.121"
pollster = "1.0.1"
typestate-groups = { path = "../typestate-groups" }
zerocopy = { version = "0.8.59", features = ["derive"] }
