[package]
name = "typestate-groups"
version = "0.3.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Typestate based grouping types for Rust"
keywords = ["typestate", "state-machine", "grouping", "type"]
categories = ["rust-patterns", "data-structures"]
readme = "../README.md"

[features]
default = ["alloc"]
## `Indirect` for `Box`, `Arc` and `Rc`.
alloc = []

[dependencies]
typestate-groups-macros = { path = "../typestate-groups-macros", version = "0.1.5" }
zerocopy = "0.8.59"

[dev-dependencies]
zerocopy = { version = "0.8.59", features = ["derive"] }
